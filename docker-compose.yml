version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cs2_scrims_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cs2_scrims
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cs2_scrims_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cs2_scrims_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/cs2_scrims?schema=public
      - REDIS_URL=redis://redis:6379
      - STEAM_API_KEY=${STEAM_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_cs2_scrim_league_at_least_32_chars_long}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - ADMIN_STEAM_IDS=${ADMIN_STEAM_IDS}
      - UPLOAD_DIR=/app/uploads
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: cs2_scrims_worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/cs2_scrims?schema=public
      - REDIS_URL=redis://redis:6379
      - STEAM_API_KEY=${STEAM_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_cs2_scrim_league_at_least_32_chars_long}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - ADMIN_STEAM_IDS=${ADMIN_STEAM_IDS}
      - UPLOAD_DIR=/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

volumes:
  pgdata:
  redisdata:
  uploads_data:
